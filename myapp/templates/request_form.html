{% extends 'base.html' %}

{% block title %}Request Collection | TakaSmart Kenya{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card auth-card-wide">
        <h1>Request a collection</h1>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <small class="error-text">{{ error }}</small>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-yellow btn-block">Submit request</button>
        </form>

        <p class="auth-switch"><a href="{% url 'dashboard' %}">Cancel</a></p>
    </div>
</section>
{% endblock %}
